{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Seitennavigation {{ label }}">
  {% if page_obj.has_previous %}
  <a class="button utility small" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Zurück</a>
  {% endif %}
  <span>Seite {{ page_obj.number }} von {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a class="button utility small" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Weiter</a>
  {% endif %}
</nav>
{% endif %}
