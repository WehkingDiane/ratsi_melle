{% load static navigation %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ratsi Melle{% endblock %}</title>
  {% with ui_version="0.5.64" %}
  <link rel="stylesheet" href="{% static 'core/css/base.css' %}?v={{ ui_version }}">
  <link rel="stylesheet" href="{% static 'core/css/layout.css' %}?v={{ ui_version }}">
  <link rel="stylesheet" href="{% static 'core/css/navigation.css' %}?v={{ ui_version }}">
  <link rel="stylesheet" href="{% static 'core/css/components.css' %}?v={{ ui_version }}">
  <link rel="stylesheet" href="{% static 'core/css/status.css' %}?v={{ ui_version }}">
  {% endwith %}
</head>
<body>
  <a class="skip-link" href="#main-content">Zum Hauptinhalt</a>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand-block">
        <a class="brand" href="{% url 'dashboard' %}">Ratsi Melle</a>
        <p>Lokale Arbeitsoberfläche</p>
      </div>
      <button class="nav-toggle" type="button" aria-label="Navigation öffnen" aria-expanded="false" aria-controls="main-navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="main-nav" id="main-navigation" aria-label="Hauptnavigation">
        {% main_navigation %}
      </nav>
      <a class="job-indicator" id="job-indicator" href="{% url 'data_tools:index' %}" hidden>
        <span class="job-spinner" aria-hidden="true"></span>
        <span id="job-indicator-text">Datenjob läuft</span>
      </a>
    </div>
  </header>
  <main class="shell" id="main-content" tabindex="-1">
    <div class="page-stack">
    {% block content %}{% endblock %}
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">Lokale Entwicklungsoberfläche</div>
  </footer>
  <script src="{% static 'core/js/service_status.js' %}"></script>
  <script src="{% static 'core/js/navigation.js' %}"></script>
</body>
</html>
