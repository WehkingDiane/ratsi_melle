<div>
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="checkbox-inline">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% endif %}
  {{ field.errors }}
  {% if field.help_text %}<p class="muted" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
